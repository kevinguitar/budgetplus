# Opens Search from Record through the shared Overview navigation.
appId: com.kevlina.budgetplus
---
- runFlow:
    file: open-overview.yml
    env:
      RECORD_TYPE: '${typeof RECORD_TYPE === "undefined" ? "Expense" : RECORD_TYPE}'
- tapOn:
    text: "Search"
- extendedWaitUntil:
    visible:
      text: "Enter keyword"
    timeout: 15000
