# Opens the Overview (history) screen from the Record screen by tapping the bottom-nav
# history button (contentDescription "bottom_nav_history") and waiting for the
# "<Book>'s Overview" title.
#
# The bottom-nav tap occasionally registers on iOS without triggering navigation (the tap
# is reported as completed but the app stays on Record). Retry the tap until the Overview
# title appears. Guard the tap so a slow-but-successful navigation from a previous attempt
# doesn't re-tap on the wrong screen.
appId: com.kevlina.budgetplus
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: ".*'s Overview"
          commands:
            - tapOn:
                text: "bottom_nav_history"
      - extendedWaitUntil:
          visible:
            text: ".*'s Overview"
          timeout: 15000
- assertVisible:
    text: ".*'s Overview"
