# From Record, restore Milk Tea through the actual picker/save path, from any tone.
appId: com.kevlina.budgetplus
---
- runFlow: open-color-tone-picker.yml
# Save's icon child is exposed as enabled on iOS even when its parent is disabled.
# Capture whether the saved starting page actually needs changing instead.
- evalScript: ${output.colorToneResetNeeded = true}
- runFlow:
    when:
      visible:
        text: "color_tone_page_0(,.*)?"
    commands:
      - evalScript: ${output.colorToneResetNeeded = false}
- repeat:
    times: 5
    while:
      notVisible:
        text: "color_tone_page_0(,.*)?"
    commands:
      - tapOn:
          text: "color_tone_previous"
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    text: "color_tone_page_0(,.*)?"
# If a change was needed, it must save first. Otherwise leave without a fake save.
- runFlow:
    when:
      true: ${output.colorToneResetNeeded}
    commands:
      - tapOn:
          text: "Save"
      - extendedWaitUntil:
          visible:
            text: ".*'s Settings"
          timeout: 15000
- runFlow:
    when:
      true: ${!output.colorToneResetNeeded}
    commands:
      - tapOn:
          text: "Back"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- runFlow: return-to-record.yml
