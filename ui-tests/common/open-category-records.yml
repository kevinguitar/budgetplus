# From the Overview screen, opens the Records screen for a given CATEGORY.
# Handles the persisted overview mode: works whether Overview is in
# Group-by-categories (tap group -> Records) or All-Records (tapping a row opens
# the edit dialog, so we toggle the mode first).
appId: com.kevlina.budgetplus
---
- extendedWaitUntil:
    visible:
      text: "${CATEGORY}"
    timeout: 15000
- tapOn:
    text: "${CATEGORY}"
- extendedWaitUntil:
    visible:
      text: "Edit Record|${CATEGORY}: .*"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: "Edit Record"
    commands:
      # We were in All-Records mode; close the dialog and switch to Group-by-categories.
      - tapOn:
          point: "50%,8%"
      - extendedWaitUntil:
          notVisible:
            text: "Edit Record"
          timeout: 10000
      - tapOn:
          text: "overview_mode_toggle"
      - tapOn:
          text: "${CATEGORY}"
- extendedWaitUntil:
    visible:
      text: "${CATEGORY}: .*"
    timeout: 15000
- assertVisible:
    text: "${CATEGORY}: .*"
