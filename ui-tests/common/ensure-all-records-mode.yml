# Ensures the Overview is in All-Records mode so long-pressing a record opens the context
# menu. Probes by tapping a record row: in All-Records mode this opens the "Edit Record"
# dialog; in Group-by-categories it drills into the Records screen.
# Param: CATEGORY — a category name that has at least one record.
appId: com.kevlina.budgetplus
---
# Wait for the Overview (and the probed category row) to settle before tapping. On a still
# animating/loading chart the first tap can miss, so re-tap once if neither the Edit Record
# dialog nor the category drill has appeared yet.
- extendedWaitUntil:
    visible:
      text: "${CATEGORY}"
    timeout: 15000
- tapOn:
    text: "${CATEGORY}"
- runFlow:
    when:
      notVisible:
        text: "Edit Record|${CATEGORY}: .*"
    commands:
      - tapOn:
          text: "${CATEGORY}"
- extendedWaitUntil:
    visible:
      text: "Edit Record|${CATEGORY}: .*"
    timeout: 15000
# Case A: All-Records mode -> dismiss the probe edit dialog. The dialog auto-focuses the
# Note field and opens the keyboard, so hideKeyboard is unreliable on iOS. Tap the scrim
# just above the dialog (below the status bar, above the dialog top on both platforms):
# it lands outside the dialog and dismisses it via dismissOnClickOutside. Avoid the very
# top (iOS status bar) and the dialog body (Android dialog is nearly full-width).
- runFlow:
    when:
      visible:
        text: "Edit Record"
    commands:
      - tapOn:
          point: "50%,8%"
      - extendedWaitUntil:
          notVisible:
            text: "Edit Record"
          timeout: 10000
# Case B: Group-by-categories -> we're on the Records screen; go back and toggle mode.
- runFlow:
    when:
      visible:
        text: "${CATEGORY}: "
    commands:
      - tapOn:
          text: "Back"
      - extendedWaitUntil:
          visible:
            text: ".*'s Overview"
          timeout: 15000
      - tapOn:
          text: "overview_mode_toggle"
- extendedWaitUntil:
    visible:
      text: ".*'s Overview"
    timeout: 15000
