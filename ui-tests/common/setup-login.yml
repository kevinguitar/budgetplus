# Idempotent provisioning subflow: ensures the app is authorized with a book and
# lands on the RecordScreen (identified by the "AC" calculator button).
# Handles three initial states: already on Record, on the Auth screen (not signed in),
# or on the Welcome screen (signed in but no book).
appId: com.kevlina.budgetplus
---
- launchApp
- runFlow: dismiss-system-dialogs.yml
- extendedWaitUntil:
    visible:
      text: "Continue with Google|Book Name|AC"
    timeout: 45000
# Sign in if we're on the Auth screen.
# The Firebase Auth emulator Google sign-in occasionally fails and bounces the app
# back to the Auth screen (observed on iOS CI: the "Continue with Google" tap lands
# on the auth webview then returns to Welcome without authenticating). Retry the whole
# sign-in gesture until we leave the Auth screen (i.e. "Book Name" or "AC" appears).
- runFlow:
    when:
      visible:
        text: "Continue with Google"
    commands:
      - retry:
          maxRetries: 3
          commands:
            # Only tap when we're actually still on the Auth screen. A previous attempt's
            # sign-in can succeed slowly: the assert below times out and triggers a retry,
            # but by the time this runs the app has already navigated to Welcome/Record, so
            # "Continue with Google" is gone. Tapping it unconditionally then throws
            # ElementNotFound and fails the whole flow even though sign-in worked. Guard the
            # tap so such a retry just re-checks the assert (which now passes).
            - runFlow:
                when:
                  visible:
                    text: "Continue with Google"
                commands:
                  - tapOn:
                      text: "Continue with Google"
                  - runFlow: dismiss-system-dialogs.yml
            # After sign-in the app lands on Welcome ("Book Name") for a new account,
            # or straight on Record ("AC") if a book already exists. If the sign-in
            # bounced back, "Continue with Google" is still visible and the assert
            # below fails, triggering a retry of the tap.
            - extendedWaitUntil:
                visible:
                  text: "Book Name|AC"
                timeout: 45000
            - assertVisible:
                text: "Book Name|AC"
# Create the book if we're on the Welcome screen.
- runFlow:
    when:
      visible:
        text: "Book Name"
    commands:
      - tapOn:
          text: "My accounting book"
      - inputText: "UI Test Book"
      # Dismiss the keyboard by tapping the neutral heading (cross-platform; iOS
      # SwiftUI does not always support hideKeyboard).
      - tapOn:
          text: "You can create a new accounting book"
      - tapOn:
          text: "Go"
      - extendedWaitUntil:
          visible:
            text: "AC"
          timeout: 30000
- extendedWaitUntil:
    visible:
      text: "AC"
    timeout: 30000
- assertVisible:
    text: "AC"
