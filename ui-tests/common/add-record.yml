# Adds a single expense record of price 100 in the given category.
# Params: CATEGORY — the category pill text to tap.
# Used by flows that need to add several records (e.g. interstitial cadence).
appId: com.kevlina.budgetplus
---
- tapOn:
    text: "AC"
# Do not inherit Income from a prior flow that failed before restoring the tab.
- runFlow:
    when:
      notVisible:
        text: "Expense"
    commands:
      - swipe:
          start: "50%,25%"
          end: "50%,45%"
          duration: 400
- tapOn:
    text: "Expense"
# On short screens the category grid can be pushed out of view behind the fixed
# calculator: after adding a prior record the grid can be scrolled either way, so the
# target pill may sit above OR below the fold. scrollUntilVisible swipes from screen
# center, which lands on the fixed calculator and fails to scroll the category band.
# Instead swipe *within* the category/info band (as open-category-editor.yml does),
# alternating direction so the pill is revealed whichever way the grid is scrolled.
# Each swipe is guarded by notVisible, so it's a no-op once the pill is on screen.
- retry:
    maxRetries: 6
    commands:
      # Reveal pills that are below the fold (swipe the band up).
      - runFlow:
          when:
            notVisible:
              text: "${CATEGORY}"
          commands:
            - swipe:
                start: "50%,45%"
                end: "50%,15%"
                duration: 400
      # Reveal pills that are above the fold (swipe the band down).
      - runFlow:
          when:
            notVisible:
              text: "${CATEGORY}"
          commands:
            - swipe:
                start: "50%,15%"
                end: "50%,45%"
                duration: 400
      - assertVisible:
          text: "${CATEGORY}"
- tapOn:
    text: "${CATEGORY}"
- tapOn:
    text: "1"
- tapOn:
    text: "0"
- tapOn:
    text: "0"
- assertVisible:
    text: "record_amount_100(,.*)?"
- tapOn:
    text: "OK"
- extendedWaitUntil:
    visible:
      text: "record_amount_0(,.*)?"
    timeout: 10000
