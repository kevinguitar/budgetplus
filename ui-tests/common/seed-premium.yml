# Flips the current (anonymous) user to premium via the UI-test-only deeplink, which
# calls authManager.markPremium(true). Idempotent: if the user is already premium
# (no "unlocked" snackbar), we still confirm the premium state via the absence of the
# stable banner container on the Record screen (even while an ad is loading).
appId: com.kevlina.budgetplus
---
# On iOS the deeplink is delivered through a conflating StateFlow<Event> collected in a
# LaunchedEffect; if the event is sent before/around the collector subscribing it can be
# dropped, so a single openLink intermittently never reaches markPremium (observed: the
# "unlocked" snackbar never appears and the banner ad stays). The deeplink is idempotent
# (markPremium short-circuits when already premium), so retry the whole send until premium
# actually takes effect — confirmed by the stable "Banner Ad Area" container being
# gone on the Record screen.
# iOS flows share the authenticated user. Once premium is confirmed on Record,
# avoid another native deeplink/confirmation round-trip; a fresh user still seeds.
# Use the stable container, never ad fill/content, as the state signal.
- evalScript: ${output.shouldSeedPremium = true}
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: assert-on-record.yml
      - runFlow:
          when:
            notVisible:
              text: "Banner Ad Area"
          commands:
            - evalScript: ${output.shouldSeedPremium = false}
- runFlow:
    when:
      true: ${output.shouldSeedPremium}
    commands:
      - retry:
          maxRetries: 3
          commands:
            - openLink: "budgetplus://uiTestPremium"
            # iOS may show an "Open in Budget+?" confirmation.
            - tapOn:
                text: "Open"
                optional: true
            - runFlow: assert-on-record.yml
            - extendedWaitUntil:
                notVisible:
                  text: "Banner Ad Area"
                timeout: 20000
            - assertNotVisible:
                text: "Banner Ad Area"
- runFlow: assert-on-record.yml
- assertNotVisible:
    text: "Banner Ad Area"
# Dismiss the (persistent, UI-test) "unlocked" snackbar so it doesn't block later
# bottom-screen interactions (e.g. the Overview Search FAB, or the lower rows of the
# Settings list like "Color Tone Picker"). UI-test builds make the snackbar
# tap-to-dismiss (swipe gestures are unreliable on the iOS automation driver).
#
# Wait for the snackbar to actually disappear before returning: on iOS the snackbar
# lingers and its bottom overlay intermittently covers whatever a caller scrolls to
# next, which surfaced as a flaky "Element not found" (e.g. Color Tone Picker). A
# single tap without waiting was racy; block until it's gone so callers get a clean
# screen every time.
- runFlow:
    when:
      visible:
        text: "Budget+ Premium unlocked!"
    commands:
      - tapOn:
          text: "Budget+ Premium unlocked!"
      - extendedWaitUntil:
          notVisible:
            text: "Budget+ Premium unlocked!"
          timeout: 8000
