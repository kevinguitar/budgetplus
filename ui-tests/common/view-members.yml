# From Settings, verifies the owner in Members and dismisses the dialog.
appId: com.kevlina.budgetplus
---
- tapOn:
    text: "View Members"
- extendedWaitUntil:
    visible:
      text: "Members"
    timeout: 15000
- assertVisible:
    text: "Owner"
# System back does not dismiss Compose dialogs reliably on iOS.
- tapOn:
    point: "50%,12%"
- extendedWaitUntil:
    notVisible:
      text: "Members"
    timeout: 10000
- assertVisible:
    text: ".*'s Settings"
