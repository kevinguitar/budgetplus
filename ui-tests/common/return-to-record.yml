# Returns to the Record screen from a nested screen. Prefers the top-bar "Back" arrow
# (contentDescription "Back") which works on both Android and iOS, then the bottom
# Add tab. Native sharing UI must first use dismiss-share-sheet; system Back is
# only a last-resort fallback. Auth/Welcome recovery re-provisions via setup-login.
appId: com.kevlina.budgetplus
---
# A late iOS "Open in Budget+?" deeplink confirmation (from the premium seed deeplink) can
# reappear over the Record screen and block the AC assertion below. Dismiss it if present.
- tapOn:
    text: "Cancel"
    optional: true
- repeat:
    times: 3
    while:
      notVisible:
        text: "AC"
    commands:
      # Prefer real back navigation from nested screens. Their Add tab may already
      # be selected; tapping it is a no-op that can stall Maestro's animation wait.
      - evalScript: ${output.returnNavigationHandled = false}
      - runFlow:
          when:
            visible:
              text: "Back"
          commands:
            - evalScript: ${output.returnNavigationHandled = true}
            - tapOn:
                text: "Back"
      - runFlow:
          when:
            true: ${!output.returnNavigationHandled}
          commands:
            # Overview has bottom navigation but no top-bar Back arrow.
            - runFlow:
                when:
                  visible:
                    text: "bottom_nav_add"
                commands:
                  - evalScript: ${output.returnNavigationHandled = true}
                  - tapOn:
                      text: "bottom_nav_add"
      # Capture which action ran before navigation changes the hierarchy, so one
      # iteration cannot send two back actions after arriving on Record.
      - runFlow:
          when:
            true: ${!output.returnNavigationHandled}
          commands:
            - back
- runFlow:
    when:
      visible:
        text: "Continue with Google|Book Name"
    commands:
      - runFlow: setup-login.yml
- runFlow: assert-on-record.yml
