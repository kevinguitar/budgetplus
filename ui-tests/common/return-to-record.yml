# Returns to the Record screen from a nested screen. Prefers the top-bar "Back" arrow
# (contentDescription "Back") which works on both Android and iOS; falls back to the
# system back gesture for dialogs/paywalls without a top bar. If that leaves the app on
# Auth/Welcome (rare iOS navigation races), re-provisions via setup-login.
appId: com.kevlina.budgetplus
---
# A late iOS "Open in Budget+?" deeplink confirmation (from the premium seed deeplink) can
# reappear over the Record screen and block the AC assertion below. Dismiss it if present.
- tapOn:
    text: "Cancel"
    optional: true
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: "AC"
          commands:
            # Overview has bottom navigation, not a top-bar Back arrow.
            - runFlow:
                when:
                  visible:
                    text: "bottom_nav_add"
                commands:
                  - tapOn:
                      text: "bottom_nav_add"
            - runFlow:
                when:
                  notVisible:
                    text: "AC"
                commands:
                  # Remember which branch ran BEFORE navigation changes the hierarchy.
                  # Re-checking Back after tapping it could send a second back from Record.
                  - evalScript: ${output.usedTopBarBack = false}
                  - runFlow:
                      when:
                        visible:
                          text: "Back"
                      commands:
                        - evalScript: ${output.usedTopBarBack = true}
                        - tapOn:
                            text: "Back"
                  - runFlow:
                      when:
                        true: ${!output.usedTopBarBack}
                      commands:
                        - back
- runFlow:
    when:
      visible:
        text: "Continue with Google|Book Name"
    commands:
      - runFlow: setup-login.yml
- runFlow: assert-on-record.yml
