# Dismiss transient OS dialogs. On iOS, look for any supported button at once:
# separate optional taps wait for absent buttons and capture warning screenshots.
appId: com.kevlina.budgetplus
---
- runFlow:
    when:
      platform: iOS
    commands:
      # Handle consecutive prompts, including ATT arriving after notifications.
      - repeat:
          times: 4
          while:
            visible:
              text: "Cancel|Not Now|Ask App Not to Track|Allow"
          commands:
            # ATT offers both "Ask App Not to Track" and "Allow". Preserve the
            # decline preference rather than relying on accessibility-tree order.
            - evalScript: ${output.systemDialogHandled = false}
            - runFlow:
                when:
                  visible:
                    text: "Ask App Not to Track"
                commands:
                  - tapOn:
                      text: "Ask App Not to Track"
                      optional: true
                  - evalScript: ${output.systemDialogHandled = true}
            - runFlow:
                when:
                  true: ${!output.systemDialogHandled}
                commands:
                  - tapOn:
                      text: "Cancel|Not Now|Allow"
                      optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
      - tapOn:
          text: "Ask App Not to Track"
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
