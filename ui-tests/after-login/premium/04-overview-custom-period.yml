# P4 — Premium user can open a custom overview period without the upsell
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- runFlow: ../../common/open-overview.yml
# Open the custom date-range picker via the date-range row's calendar icon ("Select Date").
- tapOn:
    text: "Select Date"
# Assert on the dialog's stable UI-test identifier rather than the Material3/Calf
# "Select dates" header, which is not reliably exposed as accessibility text on iOS.
- extendedWaitUntil:
    visible:
      text: "Date Range Picker"
    timeout: 15000
# Premium: no "above one month" upsell is shown.
- assertNotVisible:
    text: "Unlock premium to set the period above one month"
# Dismiss the date-range picker and return to Record.
- tapOn:
    text: "Cancel"
- runFlow: ../../common/return-to-record.yml
