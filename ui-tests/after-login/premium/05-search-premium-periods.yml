# P5 — Premium user can select premium search periods without a paywall
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
- tapOn:
    text: "bottom_nav_history"
- extendedWaitUntil:
    visible:
      text: ".*'s Overview"
    timeout: 15000
# The persistent "Premium unlocked!" snackbar overlaps the bottom-right Search FAB
# on iOS. Tap it to dismiss (UI-test builds make the snackbar tap-to-dismiss, since
# swipe gestures are unreliable to drive from the iOS automation driver), so the FAB
# is fully exposed, then tap Search.
- runFlow:
    when:
      visible:
        text: "Budget+ Premium unlocked!"
    commands:
      - tapOn:
          text: "Budget+ Premium unlocked!"
      - extendedWaitUntil:
          notVisible:
            text: "Budget+ Premium unlocked!"
          timeout: 8000
- tapOn:
    text: "Search"
- extendedWaitUntil:
    visible:
      text: "Enter keyword"
    timeout: 15000
- tapOn:
    text: "Last Month"
- assertVisible:
    text: "Last 6 Months"
# Premium: selecting a premium period stays in Search (no paywall).
- tapOn:
    text: "Last 6 Months"
- extendedWaitUntil:
    visible:
      text: "Enter keyword"
    timeout: 15000
- assertVisible:
    text: "Enter keyword"
- runFlow: ../../common/return-to-record.yml
