# P2 — Premium user sees no interstitial ad after adding several records
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/seed-premium.yml
- runFlow: ../../common/assert-on-record.yml
# Add 7 records; premium users should never see an interstitial and the flow proceeds.
- repeat:
    times: 7
    commands:
      - runFlow:
          file: ../../common/add-record.yml
          env:
            CATEGORY: "Food"
- runFlow: ../../common/assert-on-record.yml
# Still premium: no banner ad either.
- assertNotVisible:
    text: "Banner Ad Area"
