# R4 — Add expense end-to-end
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "AC"
- tapOn:
    text: "Expense"
- tapOn:
    text: "Food"
- evalScript: ${output.recordNote = "UI-expense-" + Date.now()}
- runFlow:
    file: ../../common/set-record-note.yml
    env:
      NOTE: "${output.recordNote}"
- tapOn:
    text: "1"
- tapOn:
    text: "2"
# Anchor below the amount display: the price field can also match "0" (see add-record.yml).
- tapOn:
    text: "0"
    below: "record_amount_.*"
- assertVisible:
    text: "record_amount_120(,.*)?"
- tapOn:
    text: "OK"
# After a successful record the price resets to 0.
- extendedWaitUntil:
    visible:
      text: "record_amount_0(,.*)?"
    timeout: 10000
- assertVisible:
    text: "AC"
- runFlow:
    file: ../../common/assert-record-saved.yml
    env:
      NOTE: "${output.recordNote}"
      RECORD_TYPE: "Expense"
      CATEGORY: "Food"
      PRICE: "120"
