# ST16 — Record Widget lists the frequently recorded items
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/assert-on-record.yml
# Make sure there is at least one record in the last 30 days.
- runFlow:
    file: ../../common/add-record.yml
    env:
      CATEGORY: "Food"
- runFlow: ../../common/open-settings.yml
# Use the default scroll timeout: on slow iOS runners one hierarchy check plus one swipe
# took ~10s, so a 10s timeout expired right after the row scrolled into view.
# Center it so the tap doesn't land under the fixed banner ad / bottom nav.
- scrollUntilVisible:
    element:
      text: "Record Widget"
    direction: DOWN
    centerElement: true
# Record Widget is available to every user and opens its dedicated screen.
- tapOn:
    text: "Record Widget"
- extendedWaitUntil:
    visible:
      text: "Adds to: .*"
    timeout: 15000
# The record without a note is listed by its category. iOS appends the merged row text
# (e.g. ", Food, 2 times, Food") to the accessibility label; accept that suffix.
- extendedWaitUntil:
    visible:
      text: "record_widget_item_Expense_Food_Food(,.*)?"
    timeout: 15000
- tapOn:
    text: "record_widget_item_Expense_Food_Food(,.*)?"
- assertVisible:
    text: "record_widget_done(,.*)?"
- runFlow: ../../common/return-to-record.yml
