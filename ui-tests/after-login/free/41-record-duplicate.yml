# E4 — Duplicate a record via the long-press menu (Overview, All-Records mode)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow:
    file: ../../common/add-record.yml
    env:
      CATEGORY: "Daily"
- tapOn:
    text: "bottom_nav_history"
- extendedWaitUntil:
    visible:
      text: ".*'s Overview"
    timeout: 15000
- runFlow:
    file: ../../common/ensure-all-records-mode.yml
    env:
      CATEGORY: "Daily"
- extendedWaitUntil:
    visible:
      text: "Daily"
    timeout: 15000
- longPressOn:
    text: "Daily"
- extendedWaitUntil:
    visible:
      text: "Duplicate"
    timeout: 10000
- tapOn:
    text: "Duplicate"
- extendedWaitUntil:
    visible:
      text: "Record duplicated"
    timeout: 10000
- tapOn:
    text: "bottom_nav_add"
- runFlow: ../../common/assert-on-record.yml
