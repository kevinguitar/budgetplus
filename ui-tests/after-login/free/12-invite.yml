# B3 — Invite opens the OS share sheet
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "Invite"
# The OS share sheet appears; assert we left the Record screen (calculator hidden),
# then dismiss it and return.
- extendedWaitUntil:
    notVisible:
      text: "AC"
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "ActivityListView"
          timeout: 15000
      # The sheet's content renders out of process (ShareSheet.RemoteContainerView), and on
      # CI simulators it can stay blank or be missing from the hierarchy even when drawn, so
      # this check doesn't fail the flow. The share text is "<message>\n<link>", and `.`
      # doesn't match the newline.
      - extendedWaitUntil:
          visible:
            text: 'Click the link to track expenses with me![\s\S]*'
          timeout: 10000
          optional: true
- runFlow: ../../common/dismiss-share-sheet.yml
- runFlow: ../../common/return-to-record.yml
