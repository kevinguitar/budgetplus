# ST2 — Rename user
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-settings.yml
- tapOn:
    text: "Rename User"
- extendedWaitUntil:
    visible:
      text: "User Name"
    timeout: 15000
# The rename dialog auto-focuses its text field (InputDialog requests focus on show), so the
# keyboard is already up. Do NOT tap the field first: on iOS a tap on an already-focused
# field can trigger a very slow screenshot-diff wait that blows the maestro-driver's session
# timeout and kills the flow. Erase/type directly into the focused field instead.
- eraseText
- inputText: "Tester"
- pressKey: Enter
# The "Renamed to Tester" toast is transient and can vanish before Maestro polls for it
# (flaky). A successful rename closes the input dialog, so wait for it to dismiss instead.
- extendedWaitUntil:
    notVisible:
      text: "User Name"
    timeout: 10000
- runFlow: ../../common/return-to-record.yml
