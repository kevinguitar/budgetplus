# B1 — Open book dropdown
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-book-dropdown.yml
- assertVisible:
    text: "UI Test Book"
# Dismiss via the scrim on both platforms.
- tapOn:
    point: "50%,45%"
- extendedWaitUntil:
    notVisible:
      text: "Create a New Book"
    timeout: 10000
