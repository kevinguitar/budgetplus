# ST13 — Batch Record routes free user to the paywall
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-settings.yml
- tapOn:
    text: "Batch Record"
# Free user is routed to Unlock Premium rather than the Batch Record screen.
- extendedWaitUntil:
    notVisible:
      text: "Batch Record"
    timeout: 15000
- runFlow: ../../common/return-to-record.yml
