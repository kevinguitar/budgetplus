# ST4 — Rename book
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-settings.yml
- tapOn:
    text: "Rename Book"
- extendedWaitUntil:
    visible:
      text: "Book Name"
    timeout: 15000
# The rename dialog auto-focuses its text field (InputDialog requests focus on show), so the
# keyboard is already up. Do NOT tap the field first: on iOS a tap on an already-focused
# field triggers a very slow screenshot-diff wait (~2 min) that can blow the maestro-driver's
# session timeout and kill the flow. Erase/type directly into the focused field instead.
- eraseText
- inputText: "Renamed Book"
- pressKey: Enter
# Assert on the persistent Settings header rather than the transient rename toast, which
# can vanish before Maestro polls for it (flaky).
- extendedWaitUntil:
    visible:
      text: "Renamed Book's Settings"
    timeout: 10000
# Rename back so later flows still find "UI Test Book".
- tapOn:
    text: "Rename Book"
- extendedWaitUntil:
    visible:
      text: "Book Name"
    timeout: 15000
# Field is auto-focused (see note above); erase/type directly without tapping it first.
- eraseText
- inputText: "UI Test Book"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "UI Test Book's Settings"
    timeout: 10000
- runFlow: ../../common/return-to-record.yml
