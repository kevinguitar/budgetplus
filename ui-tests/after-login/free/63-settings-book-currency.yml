# ST5 — Edit book currency (change to Euro, then restore US Dollar)
# Note: committing a currency change triggers app navigation that can land on either
# Settings or Record, so we assert the picker closed (change accepted) and recover.
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Edit Book Currency"
- extendedWaitUntil:
    visible:
      text: "Book's Currency"
    timeout: 15000
- tapOn:
    text: "Euro"
# The picker closes once the change is committed. The first tap on a currency tile
# occasionally does not register on iOS (the picker stays open), so retry once if it is
# still showing. Wait for the close animation to settle BEFORE deciding whether to retry:
# checking too early sees the title mid-close and fires a stale tap that lands on the
# Settings screen underneath, re-opening the picker (the flaky failure this guards against).
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        text: "Book's Currency"
    commands:
      - tapOn:
          text: "Euro"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    notVisible:
      text: "Book's Currency"
    timeout: 15000
- assertNotVisible:
    text: "Book's Currency"
- runFlow: ../../common/return-to-record.yml
# Restore US Dollar so later flows keep the default currency.
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: ".*'s Settings"
    timeout: 15000
- tapOn:
    text: "Edit Book Currency"
- extendedWaitUntil:
    visible:
      text: "Book's Currency"
    timeout: 15000
- tapOn:
    text: "US Dollar"
# Settle the close animation before deciding whether to retry (see the Euro note above):
# an early re-check would fire a stale tap onto the Settings screen and re-open the picker.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        text: "Book's Currency"
    commands:
      - tapOn:
          text: "US Dollar"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    notVisible:
      text: "Book's Currency"
    timeout: 15000
- runFlow: ../../common/return-to-record.yml
