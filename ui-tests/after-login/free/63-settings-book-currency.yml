# ST5 — Edit book currency (change to Euro, then restore US Dollar)
# Note: committing a currency change triggers app navigation that can land on either
# Settings or Record. We confirm the change committed via the "currency changed" snackbar
# (deterministic, unlike watching the picker close), then assert the picker closed and recover.
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-settings.yml
- tapOn:
    text: "Edit Book Currency"
- extendedWaitUntil:
    visible:
      text: "Book's Currency"
    timeout: 15000
- tapOn:
    text: "Euro"
# The picker commits the change and navigates away. Rather than re-tapping the tile if the
# picker still looks open (a stale tap can land on the Settings screen underneath and
# re-open the picker — the flaky failure this used to hit), wait for the deterministic
# "currency changed" snackbar, which only fires once the change is committed. In UI-test
# builds the snackbar stays on screen and is tap-to-dismiss, so we clear it before moving on.
- extendedWaitUntil:
    visible:
      text: ".*currency has been changed to.*"
    timeout: 15000
# Dismiss the (indefinite, UI-test) snackbar so it doesn't block later steps.
- runFlow:
    when:
      visible:
        text: ".*currency has been changed to.*"
    commands:
      - tapOn:
          text: ".*currency has been changed to.*"
- extendedWaitUntil:
    notVisible:
      text: "Book's Currency"
    timeout: 15000
- assertNotVisible:
    text: "Book's Currency"
- runFlow: ../../common/return-to-record.yml
# Restore US Dollar so later flows keep the default currency.
- runFlow: ../../common/open-settings.yml
- tapOn:
    text: "Edit Book Currency"
- extendedWaitUntil:
    visible:
      text: "Book's Currency"
    timeout: 15000
- tapOn:
    text: "US Dollar"
- extendedWaitUntil:
    visible:
      text: ".*currency has been changed to.*"
    timeout: 15000
- runFlow:
    when:
      visible:
        text: ".*currency has been changed to.*"
    commands:
      - tapOn:
          text: ".*currency has been changed to.*"
- extendedWaitUntil:
    notVisible:
      text: "Book's Currency"
    timeout: 15000
- runFlow: ../../common/return-to-record.yml
