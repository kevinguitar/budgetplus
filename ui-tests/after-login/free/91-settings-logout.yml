# ST14 — Logout (destructive; runs last in the free suite)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-settings.yml
# iOS can report Logout as visible underneath the fixed banner/bottom area.
# Center it before tapping so the action reaches the actual row.
- scrollUntilVisible:
    element:
      text: "Logout"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Logout"
- extendedWaitUntil:
    visible:
      text: "Continue with Google"
    timeout: 20000
- assertVisible:
    text: "Continue with Google"
