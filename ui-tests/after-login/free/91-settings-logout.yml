# ST14 — Logout (destructive; runs last in the free suite)
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-settings.yml
# Scroll the settings list until Logout is on screen, then tap it. Logout sits
# just above "Delete Book" in the same list, so we mirror 90-settings-delete-book's
# plain scrollUntilVisible. The stricter visibilityPercentage: 80 + centerElement
# variant was flaky on iOS: Maestro intermittently under-reported the settled row's
# visible percentage and gave up even though "Logout" was fully rendered on screen.
- scrollUntilVisible:
    element:
      text: "Logout"
    direction: DOWN
- tapOn:
    text: "Logout"
- extendedWaitUntil:
    visible:
      text: "Continue with Google"
    timeout: 20000
- assertVisible:
    text: "Continue with Google"
