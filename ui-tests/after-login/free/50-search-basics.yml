# S1/S2/S3 — Search: open, keyword, and filters
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow:
    file: ../../common/add-record.yml
    env:
      CATEGORY: "Food"
- runFlow: ../../common/open-search.yml
- assertVisible:
    text: "Search"
# Without results the title has no sum (no "Search: $0").
- assertNotVisible:
    text: "Search: .*"
# S3 — filter pills present.
- assertVisible:
    text: "Expense"
- assertVisible:
    text: "All Categories"
# S2 — keyword search.
- tapOn:
    text: "Enter keyword"
- inputText: "Food"
- pressKey: Enter
- assertVisible:
    text: "Food"
# With results the title shows their sum. The query field also shows "Food", so wait
# for the sum rather than relying on the assertion above to mean the results loaded.
- extendedWaitUntil:
    visible:
      text: "Search: .*[0-9].*"
    timeout: 20000
# Back to Record.
- runFlow: ../../common/return-to-record.yml
