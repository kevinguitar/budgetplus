# O5/O6 — Overview mode toggle and chart drill-down to Records
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow:
    file: ../../common/add-record.yml
    env:
      CATEGORY: "Food"
- runFlow: ../../common/open-overview.yml
# Establish All Records before testing the mode toggle; the preference persists.
- runFlow:
    file: ../../common/ensure-all-records-mode.yml
    env:
      CATEGORY: "Food"
- tapOn:
    text: "overview_mode_toggle"
- runFlow:
    file: ../../common/open-category-records.yml
    env:
      CATEGORY: "Food"
- tapOn:
    text: "Back"
- extendedWaitUntil:
    visible:
      text: ".*'s Overview"
    timeout: 15000
# Toggle back to All Records so the persisted mode is restored for later flows.
- tapOn:
    text: "overview_mode_toggle"
- runFlow:
    file: ../../common/ensure-all-records-mode.yml
    env:
      CATEGORY: "Food"
- tapOn:
    text: "bottom_nav_add"
- runFlow: ../../common/assert-on-record.yml
