# S4 — Search period gating for free users
appId: com.kevlina.budgetplus
---
- runFlow: ../../common/setup-login.yml
- runFlow: ../../common/open-search.yml
# Open the period selector (pill initially shows "Past Month").
- tapOn:
    text: "Past Month"
# The bottom sheet lists all periods.
- assertVisible:
    text: "Past 6 Months"
- assertVisible:
    text: "Past Year"
- assertVisible:
    text: "Custom"
# Selecting a premium period routes a free user to the paywall (leaves Search).
- tapOn:
    text: "Past 6 Months"
- extendedWaitUntil:
    notVisible:
      text: "Enter keyword"
    timeout: 15000
- assertNotVisible:
    text: "Enter keyword"
- runFlow: ../../common/assert-on-paywall.yml
# Leave the paywall and return to the Record screen.
- runFlow: ../../common/return-to-record.yml
