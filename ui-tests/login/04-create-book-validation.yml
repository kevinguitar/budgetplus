# L5 — Create-book validation: Go is a no-op while name is blank, actionable after typing
appId: com.kevlina.budgetplus
---
- launchApp:
    clearState: true
- runFlow: ../common/ensure-logged-out.yml
- runFlow: ../common/sign-in-to-welcome.yml
# Blank name: tapping Go must NOT leave the Welcome screen.
- tapOn:
    text: "Go"
- assertVisible:
    text: "Book Name"
- assertVisible:
    text: "You can create a new accounting book"
# Now provide a name -> Go becomes actionable and lands on Record.
- tapOn:
    text: "My accounting book"
- inputText: "UI Test Book"
- tapOn:
    text: "You can create a new accounting book"
- tapOn:
    text: "Go"
- runFlow: ../common/dismiss-system-dialogs.yml
# The book is created and we land on Record, but iOS' App Tracking Transparency prompt
# ("Allow Budget+ to track...") can appear late — after the earlier dialog dismissal — and
# cover the "AC" calculator button. Wait for AC, and if it's still hidden, dismiss the
# late-arriving ATT/system dialog and wait again.
- runFlow:
    when:
      notVisible:
        text: "AC"
    commands:
      - runFlow: ../common/dismiss-system-dialogs.yml
- extendedWaitUntil:
    visible:
      text: "AC"
    timeout: 60000
- assertVisible:
    text: "AC"
