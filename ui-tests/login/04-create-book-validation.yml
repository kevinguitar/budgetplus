# L5 — Create-book validation: Go is a no-op while name is blank, actionable after typing
appId: com.kevlina.budgetplus
---
- launchApp:
    clearState: true
- runFlow: ../common/ensure-logged-out.yml
- runFlow: ../common/sign-in-to-welcome.yml
# Blank name: tapping Go must NOT leave the Welcome screen.
- tapOn:
    text: "Go"
- assertVisible:
    text: "Book Name"
- assertVisible:
    text: "You can create a new accounting book"
# Now provide a name -> Go becomes actionable and lands on Record.
- runFlow: ../common/create-first-book.yml
