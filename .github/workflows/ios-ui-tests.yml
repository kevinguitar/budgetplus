name: iOS UI Tests

on:
  workflow_call:

jobs:
  ios-ui-tests:
    # All shards install the exact same simulator app from iOS CI. Build time has
    # its own budget upstream, leaving this deadline entirely for setup/tests.
    name: iOS UI tests (${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Login took 16 min, free-b 70 min, premium 49 min including failed driver
        # starts. Keep free-a conservative until its first complete prebuilt run.
        include:
          - shard: login
            timeout: 30
          - shard: free-a
            timeout: 90
          - shard: free-b
            timeout: 90
          - shard: premium
            timeout: 65
    permissions:
      contents: read
      checks: write
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true
      # Cold XCTest bootstrap exceeded the default two minutes. This is still
      # inside the independent eight-minute deadline for the entire attempt.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000

    steps:
      - uses: actions/checkout@v7

      - name: Download iOS UI test app
        uses: actions/download-artifact@v8
        with:
          name: ios-ui-test-app
          path: build/ui-test-app

      - name: Unpack iOS UI test app
        run: tar -xzf build/ui-test-app/ios-ui-test-app.tar.gz -C build/ui-test-app

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run iOS UI tests
        env:
          MAESTRO_OUTPUT_DIR: build/maestro/ios
          UI_TEST_APP_PATH: ${{ github.workspace }}/build/ui-test-app/BudgetPlus.app
        run: |
          # Boot the iPhone 17 Pro simulator (matching the documented test device). Fall
          # back to the first available iPhone if that exact model isn't present on the
          # runner image, so the job still runs on older/newer macOS images.
          SIMULATOR=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and .name == "iPhone 17 Pro")][0] // empty')
          if [ -z "$SIMULATOR" ]; then
            echo "iPhone 17 Pro not found; falling back to first available iPhone." >&2
            SIMULATOR=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | test("iPhone")))][0]')
          fi
          SIMULATOR_ID=$(echo "$SIMULATOR" | jq -r '.udid')
          SIMULATOR_NAME=$(echo "$SIMULATOR" | jq -r '.name')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          mkdir -p build/maestro/ios
          set +e
          # Install the upstream app without compiling; each shard gets isolated
          # simulator/keychain state and its own Firebase emulators.
          ./ui-tests/scripts/run-ios-ui-tests.sh "$SIMULATOR_NAME" "${{ matrix.shard }}"
          result=$?
          python3 ui-tests/scripts/run_bounded.py 20s xcrun simctl io "$SIMULATOR_ID" screenshot build/maestro/ios/final-screen.png || true
          exit $result

      - name: Publish iOS UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: iOS UI test results (${{ matrix.shard }})
          path: build/maestro/ios/**/report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: iOS UI test summary
        if: always()
        run: bash ui-tests/scripts/junit-summary.sh "iOS (${{ matrix.shard }})" build/maestro/ios

      - name: Upload iOS UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-artifacts-${{ matrix.shard }}
          path: |
            build/maestro/ios
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
