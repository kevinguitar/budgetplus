name: iOS UI Tests

on:
  workflow_call:

jobs:
  ios-ui-tests:
    # Shard the Maestro suites across parallel jobs. The full sequential suite is
    # ~84 min of tests on top of a ~31 min cold Kotlin/Native framework build.
    name: iOS UI tests (${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [login, free, premium]
    permissions:
      contents: read
      checks: write
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # CI only runs on pull_request (there is no push-to-main trigger), so the
          # Gradle cache must be written from PR runs; otherwise every run recompiles the
          # Kotlin/Native framework cold (~15 min). Cache entries are keyed by content, so
          # PRs sharing the same Gradle inputs converge on the same immutable entry.
          # Read-only off main. Writing the Gradle build cache from PR runs is unsafe for
          # the iOS build: Kotlin/Native cinterop tasks (e.g. :shared:cinteropGoogleSignIn)
          # cache outputs that embed absolute paths to the SPM checkout under
          # shared/build/spmKmpPlugin, so a restored entry breaks a fresh workspace whose
          # checkout wasn't re-fetched.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Keep entries isolated per job.
          gradle-home-cache-strict-match: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native compiler and platform libs
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v2-

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v2-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ./build
          key: ${{ runner.os }}-ddata-v2-${{ hashFiles('**/Package.resolved', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-ddata-v2-

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run iOS UI tests
        env:
          MAESTRO_OUTPUT_DIR: build/maestro/ios
          # Disable the Gradle build cache for the iOS build. Kotlin/Native cinterop tasks
          # (e.g. :shared:cinteropGoogleSignIn) cache outputs that embed absolute paths to
          # the SPM checkout under shared/build/spmKmpPlugin, so a restored entry breaks a
          # fresh workspace ('umbrella header GoogleSignIn.h not found').
          GRADLE_OPTS: -Dorg.gradle.caching=false
        run: |
          # Boot the iPhone 17 Pro simulator (matching the documented test device). Fall
          # back to the first available iPhone if that exact model isn't present on the
          # runner image, so the job still runs on older/newer macOS images.
          SIMULATOR=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and .name == "iPhone 17 Pro")][0] // empty')
          if [ -z "$SIMULATOR" ]; then
            echo "iPhone 17 Pro not found; falling back to first available iPhone." >&2
            SIMULATOR=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | test("iPhone")))][0]')
          fi
          SIMULATOR_ID=$(echo "$SIMULATOR" | jq -r '.udid')
          SIMULATOR_NAME=$(echo "$SIMULATOR" | jq -r '.name')
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          mkdir -p build/maestro/ios
          set +e
          # The runner script swaps in the test Firebase config, builds the app, forces the
          # simulator to English, and runs the requested suite shard inside the Firebase
          # emulators. It restores the production GoogleService-Info.plist on exit.
          ./ui-tests/scripts/run-ios-ui-tests.sh "$SIMULATOR_NAME" "${{ matrix.shard }}"
          result=$?
          xcrun simctl io "$SIMULATOR_ID" screenshot build/maestro/ios/final-screen.png || true
          exit $result

      - name: Publish iOS UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: iOS UI test results (${{ matrix.shard }})
          path: build/maestro/ios/**/report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: iOS UI test summary
        if: always()
        run: bash ui-tests/scripts/junit-summary.sh "iOS (${{ matrix.shard }})" build/maestro/ios

      - name: Upload iOS UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-artifacts-${{ matrix.shard }}
          path: |
            build/maestro/ios
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
