name: iOS CI

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # CI only runs on pull_request (there is no push-to-main trigger), so the
          # Gradle cache must be written from PR runs; otherwise every run recompiles the
          # Kotlin/Native framework cold. Cache entries are keyed by content, so PRs
          # sharing the same Gradle inputs converge on the same immutable entry.
          # Read-only off main. Writing the Gradle build cache from PR runs is unsafe for
          # the iOS build: Kotlin/Native cinterop tasks (e.g. :shared:cinteropGoogleSignIn)
          # cache outputs that embed absolute paths to the SPM checkout under
          # shared/build/spmKmpPlugin, so a restored entry breaks a fresh workspace whose
          # checkout wasn't re-fetched.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Keep entries isolated per job.
          gradle-home-cache-strict-match: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Secrets
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
          GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}
          STAGE_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_STAGE_GOOGLE_SERVICES_PLIST }}
        run: |
          echo REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY > ./local.properties
          echo REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY >> ./local.properties
          echo $GOOGLE_SERVICES_PLIST | base64 -d > ./iosApp/iosApp/GoogleService-Info.plist
          mkdir -p ./iosApp/Firebase/Stage
          echo $STAGE_GOOGLE_SERVICES_PLIST | base64 -d > ./iosApp/Firebase/Stage/GoogleService-Info.plist

      - name: Set JAVA_HOME for Xcode build phase
        run: echo "export JAVA_HOME=$JAVA_HOME" > ./iosApp/.xcode.env

      - name: Cache Kotlin/Native compiler and platform libs
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v2-

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-v2-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ./build
          key: ${{ runner.os }}-ddata-v2-${{ hashFiles('**/Package.resolved', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-ddata-v2-

      - name: Build iOS App (simulator)
        env:
          # Disable the Gradle build cache for the iOS build. Kotlin/Native cinterop tasks
          # (e.g. :shared:cinteropGoogleSignIn) cache outputs that embed absolute paths to
          # the SPM checkout under shared/build/spmKmpPlugin, so a restored entry breaks a
          # fresh workspace ('umbrella header GoogleSignIn.h not found'). Recomputing these
          # tasks avoids reusing a poisoned/relocated entry.
          GRADLE_OPTS: -Dorg.gradle.caching=false
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            -skipPackagePluginValidation \
            -quiet
