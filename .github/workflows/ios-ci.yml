name: iOS CI

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Test Release archive verification
        run: python3 -m unittest discover -s iosApp/scripts -v

      - name: Setup Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Keep caches read-only off main. SwiftPM import's Alpha integration does
          # not support Gradle build caching yet; see GRADLE_OPTS below.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Secrets
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
          GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}
          STAGE_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_STAGE_GOOGLE_SERVICES_PLIST }}
        run: |
          echo REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY > ./local.properties
          echo REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY >> ./local.properties
          echo $GOOGLE_SERVICES_PLIST | base64 -d > ./iosApp/iosApp/GoogleService-Info.plist
          mkdir -p ./iosApp/Firebase/Stage
          echo $STAGE_GOOGLE_SERVICES_PLIST | base64 -d > ./iosApp/Firebase/Stage/GoogleService-Info.plist

      - name: Set JAVA_HOME for Xcode build phase
        run: echo "export JAVA_HOME=$JAVA_HOME" > ./iosApp/.xcode.env

      - name: Cache Kotlin/Native compiler and platform libs
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-v2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-v2-

      # Freeze keys before building: actions/cache re-evaluates its inputs during
      # post-job save, when generated SPM/DerivedData trees can make globbing hang.
      - name: Compute Xcode cache keys
        id: xcode-cache-keys
        run: |
          echo "spm=${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.swiftpm-locks/default/swiftImport/Package.resolved') }}" >> "$GITHUB_OUTPUT"
          echo "derived-data=${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.swiftpm-locks/default/swiftImport/Package.resolved', 'gradle/libs.versions.toml', 'shared/build.gradle.kts', 'core/ads/build.gradle.kts') }}" >> "$GITHUB_OUTPUT"

      - name: Cache SPM packages
        uses: actions/cache@v6
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-v3-${{ steps.xcode-cache-keys.outputs.spm }}
          restore-keys: |
            ${{ runner.os }}-spm-v3-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ./build
          key: ${{ runner.os }}-ddata-v3-${{ steps.xcode-cache-keys.outputs.derived-data }}
          restore-keys: |
            ${{ runner.os }}-ddata-v3-

      - name: Build iOS App (simulator)
        env:
          # SwiftPM import does not support Gradle build caching yet (KT-84827).
          GRADLE_OPTS: -Dorg.gradle.caching=false
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            -skipPackagePluginValidation \
            -quiet
