name: Android UI Tests

on:
  workflow_call:

jobs:
  android-ui-tests:
    name: Android UI tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [login, free, premium]
    permissions:
      contents: read
      checks: write
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
      SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # CI only runs on pull_request (there is no push-to-main trigger), so the
          # Gradle cache must be written from PR runs; otherwise every run recompiles
          # cold. Cache entries are keyed by content, so PRs sharing the same Gradle
          # inputs converge on the same immutable entry.
          # Read-only off main, mirroring the iOS jobs. Keeping the cache policy uniform
          # across jobs avoids surprising cross-job differences; the Gradle build cache is
          # only written from main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Warm the AVD once (create + cold boot + snapshot) so the test run below starts
      # from a saved snapshot instead of a cold boot. A snapshot-restored emulator is
      # measurably more stable across a long sequential suite than a freshly cold-booted
      # one, and shaves boot time off the timed run.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          ram-size: 4096M
          heap-size: 1024M
          cores: 4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_OUTPUT_DIR: build/maestro/android
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          heap-size: 1024M
          cores: 4
          force-avd-creation: false
          # Restore from the cached snapshot; write it back on exit so subsequent runs
          # keep a warm state. Drop the redundant -memory/-cores here (they conflicted
          # with ram-size/cores above) and let swiftshader render headless.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # android-emulator-runner runs each line of an inline script as its own
          # `/usr/bin/sh -c` (dash), which cannot express `set -o pipefail` or a
          # heredoc. Invoke a committed script once with bash so everything shares
          # one shell.
          script: bash ui-tests/scripts/run-android-ci.sh

      - name: Publish Android UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Android UI test results (${{ matrix.shard }})
          path: build/maestro/android/**/report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Android UI test summary
        if: always()
        run: bash ui-tests/scripts/junit-summary.sh "Android (${{ matrix.shard }})" build/maestro/android

      - name: Upload Android UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-artifacts-${{ matrix.shard }}
          path: |
            build/maestro/android
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
