name: Android UI Tests

on:
  workflow_call:

jobs:
  android-ui-tests:
    name: Android UI tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        # Keep each emulator short-lived: the full free suite lost runners after
        # 43–50 minutes and showed QEMU hangs as graphics buffers accumulated.
        shard: [login, free-a, free-b, premium]
    permissions:
      contents: read
      checks: write
    env:
      MAESTRO_CLI_NO_ANALYTICS: true
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
      MAESTRO_DISABLE_UPDATE_CHECK: true
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
      SHARD: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v7

      - name: Download Android UI test app
        uses: actions/download-artifact@v8
        with:
          name: android-ui-test-app
          path: build/ui-test-app

      - name: Configure JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .github/workflows/.java-version
          distribution: zulu

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1.22.0

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_OUTPUT_DIR: build/maestro/android
          UI_TEST_APK: ${{ github.workspace }}/build/ui-test-app/androidApp-uiTest.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          heap-size: 1024M
          cores: 4
          # Snapshot restores have produced invalid ColorBuffers and stuck animation
          # waits: Maestro inputText then takes ~10s per character until its RPC times
          # out. Cold-boot a fresh AVD, matching the runner script's recovery path.
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # android-emulator-runner runs each line of an inline script as its own
          # `/usr/bin/sh -c` (dash), which cannot express `set -o pipefail` or a
          # heredoc. Invoke a committed script once with bash so everything shares
          # one shell.
          script: bash ui-tests/scripts/run-android-ci.sh

      - name: Publish Android UI test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Android UI test results (${{ matrix.shard }})
          path: build/maestro/android/**/report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Android UI test summary
        if: always()
        run: bash ui-tests/scripts/junit-summary.sh "Android (${{ matrix.shard }})" build/maestro/android

      - name: Upload Android UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-artifacts-${{ matrix.shard }}
          path: |
            build/maestro/android
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: warn
          retention-days: 7
